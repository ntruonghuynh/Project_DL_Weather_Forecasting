[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jena-weather-forecasting"
version = "0.0.0"
description = "Seq2Seq weather forecasting project scaffold"
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]
