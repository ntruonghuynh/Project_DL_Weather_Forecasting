project: jena_weather_forecasting
seed: 42
data:
  input_hours: 168
  forecast_hours: 72
  target_features: 1
training:
  epochs: 1
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  loss: mse
  grad_clip: 1.0
  patience: 5
  teacher_forcing_ratio: 0.5
  teacher_forcing_decay: 0.0
run:
  runs_dir: runs
  parent_run_id: null
model:
  name: transformer
  owner: TV5
  implementation: src.models.transformer.WeatherTransformer
  d_model: 128
  nhead: 8
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 512
  dropout: 0.1
data_schema_ref: artifacts/preprocessing/feature_schema.json
data_config_ref: configs/data.yaml
profiling:
  warmup_steps: 5
  measurement_steps: 20
  batch_sizes:
  - 1
  - 8
  - 16
  - 32
  metrics:
  - parameter_count
  - peak_memory_mb
  - train_latency_ms
  - inference_latency_ms
