project: jena_weather_forecasting
seed: 42
data:
  input_hours: 168
  forecast_hours: 72
  target_features: 1
training:
  epochs: 10
  batch_size: 64
  # Use every sixth overlapping training window for a CPU-feasible, temporally
  # comprehensive real-data run. Validation always remains stride 1.
  data_stride: 6
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  loss: mse
  grad_clip: 1.0
  patience: 5
  teacher_forcing_ratio: 0.0
  teacher_forcing_decay: 0.0
run:
  runs_dir: runs
  parent_run_id: null
