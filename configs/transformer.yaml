defaults: base.yaml

model:
  name: transformer
  owner: TV5
  implementation: src.models.transformer.WeatherTransformer
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  num_decoder_layers: 2
  dim_feedforward: 256
  dropout: 0.1

# The construction layer must resolve n_features, target_feature_index,
# input_length and horizon from these locked sources. They are intentionally
# not duplicated as schema-specific integer literals in this model config.
data_schema_ref: artifacts/preprocessing/feature_schema.json
data_config_ref: configs/data.yaml

training:
  # Full teacher forcing uses the model's causal, vectorized decoder path.
  # Validation and prediction remain strictly autoregressive.
  teacher_forcing_ratio: 1.0

profiling:
  warmup_steps: 5
  measurement_steps: 20
  batch_sizes: [1, 8, 16, 32]
  metrics: [parameter_count, peak_memory_mb, train_latency_ms, inference_latency_ms]
