# Config for Seq2Seq Attention LSTM (owner: TV4 - Attention LSTM & Interpretability)
defaults: base.yaml

model:
  name: seq2seq_attention
  hidden_size: 128
  num_layers: 1
  dropout: 0.0
  horizon: 72
  attention_dim: null  # null -> defaults to hidden_size inside the model

data_schema_ref: artifacts/preprocessing/feature_schema.json
data_config_ref: configs/data.yaml

training:
  # Same dataset/split/metric/training budget as LSTM & Transformer models
  teacher_forcing_ratio: 0.5
  seed: 42

visualization:
  # Which decoder steps to export attention heatmaps for
  sample_decoder_steps: [0, 17, 35, 53, 71]
  num_samples: 4
